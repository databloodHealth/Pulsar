<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/cadastro.css">
    <link rel="stylesheet" href="../styles/style_etapas.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Dados pessoais | Pulsar</title>
</head>

<body>
    <header>
        <a href="/">
            <img src="../assets/images/BlackLogo.png" alt="Logo Pulsar">
        </a>
    </header>
    <main>
        <div class="content">
            <div class="etapas">
                <div class="etapa active">
                    <h1>1</h1>
                    <h2>Dados pessoais</h2>
                </div>
                <div class="traco"></div>
                <div class="etapa">
                    <h1>2</h1>
                    <h2>Triagem</h2>
                </div>
                <div class="traco"></div>
                <div class="etapa">
                    <h1>3</h1>
                    <h2>Senha</h2>
                </div>
            </div>

            <div class="container">
                <div class="container-title">
                    <h1>Criar sua conta</h1>
                    <h2>Comece sua jornada salvando vidas. Informe seus dados básicos para continuarmos.</h2>
                </div>
                <form action="" class="container-form">

                    <div class="campo-form">
                        <label for="Nome">Nome completo</label>
                        <input type="text" required id="nome" placeholder="Ex: João da Silva Santos">
                    </div>
                    <div class="campo-form">
                        <label for="E-mail">E-mail</label>
                        <input type="email" required id="email" placeholder="nome@exemplo.com">
                    </div>


                    <div class="bloco-form">

                        <div class="campo-form">
                            <label for="Cidade">Cidade</label>
                            <input type="text" required id="cidade" placeholder="Monte Alto-SP">
                        </div>
                        <div class="campo-form">
                            <label for="Celular">Celular</label>
                            <input type="number" required id="celular" placeholder="(00) 0000-0000">
                        </div>

                    </div>
                    <div class="bloco-form">
                        <div class="campo-form">
                            <label for="Data de nascimento">Data de nascimento</label>
                            <input type="date" required id="data-nascimento">
                        </div>
                        <div class="campo-form">
                            <label for="CPF">CPF</label>
                            <input type="number" id="cpf" required placeholder="000.000.000-00">
                        </div>

                    </div>

                    <div class="bot-form">
                        <a href="">Já tenho conta</a>
                        <button type="submit">Próximo </button>
                    </div>
                </form>
            </div>

            <div class="info">
                <div class="lgpd">
                    <p>Seus dados estão protegidos pela LGPD</p>
                </div>
                <div class="termos">
                    <a href="">Termos de uso</a>
                    <a href="">Privacidade</a>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
