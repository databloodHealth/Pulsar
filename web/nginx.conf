
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache dos arquivos estáticos
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Suporte ao React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
